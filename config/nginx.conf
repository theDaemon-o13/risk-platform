# Risk Platform — nginx (фронт + reverse-proxy API)
# Файл монтируется в /etc/nginx/conf.d/default.conf через bind-mount.
# Правьте на хосте → `docker compose restart web` без пересборки.

server {
    listen 80;
    server_name _;

    # Безопасность
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    client_max_body_size 20m;

    # Runtime-конфиг фронта (бандл его не содержит, чтобы можно было править без пересборки)
    location = /config.js {
        alias /usr/share/nginx/html/config.js;
        add_header Cache-Control "no-store" always;
    }

    # Reverse-proxy на API
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # SPA: всё остальное → index.html (роутинг на клиенте)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Статические ассеты — длинный кеш
        location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        # index.html — без кеша, чтобы обновления подхватывались сразу
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }
    }
}
